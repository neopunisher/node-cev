[package]
name = "node-cev"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Node.js bindings for cev: typed, calibrated decisions in one forward pass."
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Apple GPU, Apple's BLAS for the CPU path, NVIDIA GPU. macOS builds always
# have the first two (see the macOS dependencies below).
metal = ["cev-model/metal"]
accelerate = ["cev-model/accelerate"]
cuda = ["cev-model/cuda"]

[dependencies]
# The engine lives in https://github.com/CarterCole/rust-cev and is published
# on its own; nothing from it is copied here. To build against a checkout
# instead of crates.io: `npm run build:native -- --engine ../rust-cev`.
cev-core = "0.1.0"
cev-model = "0.1.0"
cev-runtime = "0.1.0"

napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
cev-model = { version = "0.1.0", features = ["metal", "accelerate"] }
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
