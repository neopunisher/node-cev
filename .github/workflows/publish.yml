name: Publish to npm

# Builds cev.<platform>-<arch>.node for each prebuilt platform, then stages
# one package that holds all of them via Trusted Publishing (OIDC) — no npm
# token is stored in this repository. npm is configured to trust this repo +
# workflow (package Settings -> Trusted Publisher -> GitHub Actions,
# "publish.yml"), and the grant is stage-only: after this workflow runs,
# approve the staged version (2FA) on npmjs.com under the package's "Staged
# Packages" tab, or with `npm stage approve`. A manual run only builds and
# tests the addons.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          # Built against glibc 2.28, so the addons also load on older
          # distributions than the runner's.
          - target: linux-x64-gnu
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install rustup
        run: |
          command -v rustup || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: cev.${{ matrix.target }}
          path: cev.${{ matrix.target }}.node
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token npm exchanges for publish access
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: cev.*
          merge-multiple: true
      - name: Check the tag and the addons
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          for target in darwin-arm64 linux-x64-gnu linux-arm64-gnu; do test -f "cev.$target.node"; done
          ls -l cev.*.node
      # Pinned: needs `npm stage` (>= 11.15); the version node-knock publishes with.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      # prepublishOnly runs build:ts + typecheck + tests before the stage. It
      # does not build the addon: the ones downloaded above are what ships.
      - run: npm stage publish
