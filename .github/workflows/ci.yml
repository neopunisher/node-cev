name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    defaults:
      run:
        working-directory: node-cev
    steps:
      - uses: actions/checkout@v5
        with:
          path: node-cev
      # The engine is a path dependency: native/Cargo.toml expects it next door.
      - uses: actions/checkout@v5
        with:
          repository: CarterCole/rust-cev
          path: rust-cev
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node-cev/package-lock.json
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node-cev/native/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node-cev/native/Cargo.lock') }}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
